# HospitalA
server {
  listen 8443 ssl;
  server_name issuer-hospitala.local;

  ssl_certificate     /etc/nginx/certs/issuer-proxy.crt;
  ssl_certificate_key /etc/nginx/certs/issuer-proxy.key;

  # mTLS: require client cert signed by CA
  ssl_client_certificate /etc/nginx/certs/ca.crt;
  ssl_verify_client on;

  location ~ ^/members/register/?$ {
    if ($ssl_client_s_dn !~ "CN=org_HospitalA_admin") { return 403; }
    proxy_pass http://issuer-hospitala:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://issuer-hospitala:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

